<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curious Dreamers — Scan</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #qr canvas, #qr img {
      width: min(90vmin, 480px) !important;
      height: min(90vmin, 480px) !important;
    }
  </style>
</head>
<body>
  <div id="qr"></div>
  <script>
    new QRCode(document.getElementById('qr'), {
      text: 'https://www.curiousdreamers.com/annecy',
      width: 512,
      height: 512,
      colorDark: '#0d1b2a',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H,
    });
  </script>
</body>
</html>
